# Bundle config layer for dsh-plugin-opencode. Applied to a profile by `dsh plugin add`.
#
# The row `id` is also the settings namespace the loader derives for volatile
# Config fields, so it must match `name` in package.json and src/index.ts.
- insert:
  - id: dsh-plugin-opencode
    name: '@quonaro/dsh-plugin-opencode'
    config:
      # Path or PATH-resolved name of the opencode executable.
      opencodePath: 'opencode'
      # --auto auto-approves every permission that is not explicitly denied.
      # Headless `opencode run` cannot answer prompts, so without this a run
      # stalls on the first guarded action. Marked dangerous upstream —
      # tighten via the `permission` section of opencode.jsonc if needed.
      auto: true
      # Default -m provider/model; empty means the opencode config default.
      model: ''
      # Default --agent (e.g. "build", "plan"); empty means the default agent.
      agent: ''
      # --attach a running `opencode serve` URL instead of a local instance.
      attach: ''
      # --pure disables external opencode plugins in spawned runs.
      pure: false
      # Cooperative timeout for one delegation call.
      timeoutMs: 600000
      # In-memory cap per output stream; overflow keeps the tail.
      maxOutputBytes: 1048576
      # Environment variable names forwarded to the opencode child process on
      # top of the subprocess seam's scrubbed base. OpenCode needs HOME/XDG
      # paths to find stored credentials (`opencode auth login`).
      forwardEnv:
      - PATH
      - HOME
      - USER
      - XDG_CONFIG_HOME
      - XDG_DATA_HOME
      - XDG_CACHE_HOME
      - OPENCODE_CONFIG
      - OPENCODE_SERVER_USERNAME
      - OPENCODE_SERVER_PASSWORD
      # Extra CLI flags appended verbatim before the prompt.
      extraArgs: []

  # Provider half: registers `opencode` as an LLM provider route (Settings → Models).
  # Remove this row if you only want the delegation tool.
  - id: dsh-plugin-opencode-provider
    name: '@quonaro/dsh-plugin-opencode/provider'
    config:
      opencodePath: 'opencode'
      auto: true
      attach: ''
      pure: false
      cwd: ''
      timeoutMs: 1800000
      stderrMaxBytes: 65536
      forwardEnv:
      - PATH
      - HOME
      - USER
      - XDG_CONFIG_HOME
      - XDG_DATA_HOME
      - XDG_CACHE_HOME
      - OPENCODE_CONFIG
      - OPENCODE_SERVER_USERNAME
      - OPENCODE_SERVER_PASSWORD
      extraArgs: []
      models:
      - id: default
        opencodeModel: ''
        name: 'OpenCode (config default)'
      localSessionTitles: true
      # List `opencode models` for the agent's real model catalog;
      # falls back to the static `models` table on failure.
      autoDiscoverModels: true
      discoveryTimeoutMs: 60000
      # Cache a successful probe this long before re-probing.
      discoveryCacheMs: 300000
